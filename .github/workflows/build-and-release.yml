name: Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
      - 'release-*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0). Leave empty to use auto-generated tag'
        required: false
        type: string
        default: ''
      create_release:
        description: 'Publish release to GitHub Releases'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build Debug & Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Secrets & Keystores
        run: |
          # Ensure .env file exists for secrets-gradle-plugin
          touch .env
          if [ -f .env.example ]; then
            cat .env.example >> .env
          fi

          # 1. Restore debug.keystore from debug.keystore.base64
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Creating debug keystore..."
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug, O=Android, C=US"
          fi

          # 2. Setup Release Signing Keystore
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using custom release keystore from secrets.KEYSTORE_BASE64..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
          elif [ -n "${{ secrets.STORE_PASSWORD }}" ] && [ -f my-upload-key.jks ]; then
            echo "Using existing my-upload-key.jks..."
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
          else
            echo "No custom release keystore secret configured. Creating temporary release keystore..."
            keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Release, OU=App, O=AIStudio, L=Unknown, S=Unknown, C=US"
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
          fi

      - name: Build Debug and Release APKs
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace
          else
            gradle :app:assembleDebug :app:assembleRelease --stacktrace
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload All APKs
        uses: actions/upload-artifact@v4
        with:
          name: all-apks
          path: app/build/outputs/apk/*/*/*.apk

      - name: Determine Release Tag
        id: release_tag
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=Release $TAG" >> $GITHUB_OUTPUT

      - name: Publish Release APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: steps.release_tag.outputs.tag != ''
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.title }}
          files: |
            app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
